<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#14161f">
  <title>1 из 8 миллиардов — симулятор жизни</title>
  <meta name="description" content="Симулятор жизни: колесо стран решает, где ты родишься. Дальше — год за годом: учёба, любовь, карьера, бизнес, казино, тёмные дела, тюрьма и побеги.">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- главное меню -->
    <section id="scr-menu" class="scr">
      <canvas id="menu-map" width="720" height="280"></canvas>
      <div class="logo"><b>1</b> из <b>8</b> миллиардов</div>
      <div class="sub">Ты не выбираешь, где родиться.</div>
      <div id="born-count" class="born"></div>
      <div id="menu-btns" class="menu-btns"></div>
      <div class="foot"><span class="age">16+</span> <span id="ver"></span></div>
    </section>
    <!-- колесо стран -->
    <section id="scr-wheel" class="scr" hidden>
      <div class="wheel-title" id="wheel-title">Где ты родишься?</div>
      <div class="wheel-wrap"><canvas id="wheel" width="640" height="640"></canvas><div class="pointer">▼</div></div>
      <div id="wheel-res" class="wheel-res"></div>
      <div class="wheel-btns"><button id="spin" class="btn big primary">🎲 Крутить колесо</button><button id="wheel-go" class="btn big primary" hidden>Дальше →</button></div>
    </section>
    <!-- свидетельство о рождении -->
    <section id="scr-birth" class="scr" hidden>
      <div id="cert" class="cert"></div>
      <div class="cert-btns"><button id="cert-go" class="btn big primary">Начать жизнь</button><button id="cert-re" class="btn ghost">↻ Переродиться</button></div>
    </section>
    <!-- жизнь -->
    <section id="scr-life" class="scr" hidden>
      <div class="life-grid">
        <aside id="side-l" class="side"><div id="dossier"></div></aside>
        <div id="life-main">
          <header id="life-top">
            <button id="me" class="me" aria-label="Профиль"><canvas id="me-cv" width="96" height="96"></canvas></button>
            <div class="who"><div id="who-name"></div><div id="who-sub"></div><div id="who-place"></div></div>
            <div class="right"><div id="money"></div><button id="life-menu" class="ico" aria-label="Меню">☰</button></div>
          </header>
          <div id="stats"></div>
          <div id="timeline">
            <div class="tl-ctrl">
              <button id="tl-play" class="tlb" aria-label="Пуск и пауза">▶</button>
              <button class="tlb sp" data-sp="1" aria-label="Скорость 1">×1</button>
              <button class="tlb sp" data-sp="2" aria-label="Скорость 2">×2</button>
              <button class="tlb sp" data-sp="4" aria-label="Скорость 4">×4</button>
              <button id="tl-skip" class="tlb" aria-label="Мотать до решения" title="Мотать до решения">⏭</button>
              <button id="tl-back" class="tlb" aria-label="Машина времени" title="Машина времени: на 5 лет назад">⏪</button>
            </div>
            <div class="tl-bar" id="tl-bar"><i id="tl-fill"></i><span id="tl-lbl"></span></div>
          </div>
          <div id="focus" class="focus"></div>
          <div id="modebar" class="modebar"></div>
          <div id="log" class="log"></div>
          <footer id="life-bar">
            <button id="btn-acts" class="btn">📋 Дела</button>
            <button id="btn-year" class="btn primary year">＋ Год</button>
          </footer>
          <div class="keys">Пробел — пауза · → — год · 1 / 2 / 3 — скорость · 4 — до решения · Д — дела · Ф — фокус · Esc — меню</div>
        </div>
        <aside id="side-r" class="side"><div class="side-h">📋 Дела</div><div id="acts-panel"></div></aside>
      </div>
    </section>
    <!-- итоги жизни -->
    <section id="scr-end" class="scr" hidden><div id="end" class="end"></div></section>

    <div id="sheet" hidden><div id="sheet-card"></div></div>
    <div id="toasts" class="toasts"></div>

    <!-- обучение прямо в игре -->
    <div id="tut" class="tut" hidden>
      <svg id="tut-shade" hidden aria-hidden="true"><path fill-rule="evenodd"/></svg>
      <div id="tut-ring" hidden></div>
      <div id="tut-spot" hidden></div>
      <div id="tut-finger" hidden aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10h.5V8.5a1.5 1.5 0 0 1 3 0V10h.5a1.5 1.5 0 0 1 3 0v4.5c0 3.3-2.2 6.5-6 6.5h-1c-2.4 0-3.7-1.2-4.8-3l-2.4-4.1a1.4 1.4 0 0 1 2.3-1.6L9 14z"/></svg></div>
      <div id="tut-bubble" role="status" aria-live="polite">
        <div class="tut-head"><span class="tut-ava" aria-hidden="true">🌍</span><b>Судьба</b><span id="tut-step"></span></div>
        <div id="tut-text"></div>
        <div class="tut-btns"><button id="tut-skip" class="btn sm" hidden>Пропустить обучение</button><button id="tut-btn" class="btn sm primary" hidden></button></div>
      </div>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/names.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/systems.js"></script>
  <script src="js/crime2.js"></script>
  <script src="js/content_core.js"></script>
  <script src="js/content_life.js"></script>
  <script src="js/content_adult.js"></script>
  <script src="js/content_world.js"></script>
  <script src="js/content_dark.js"></script>
  <script src="js/content_more.js"></script>
  <script src="js/content_crime2.js"></script>
  <script src="js/content_prison.js"></script>
  <script src="js/content_fun.js"></script>
  <script src="js/art.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/platform.js"></script>
  <script src="js/minigames.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
